<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
 
  <form action="thanks.html" method="get">
 
    <p>
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required>
    </p>
 
    <p>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </p>
 
    <p>
      Gender:
      <input type="radio" id="male" name="gender" value="Male">
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="Female">
      <label for="female">Female</label>
    </p>
 
    <p>
      <label for="department">Department:</label>
      <select id="department" name="department">
        <option value="AI">AI</option>
        <option value="CS">CS</option>
        <option value="SE">SE</option>
        <option value="EE">EE</option>
      </select>
    </p>
 
    <p>
      Interests:
      <input type="checkbox" id="web" name="interests" value="Web">
      <label for="web">Web</label>
      <input type="checkbox" id="ai" name="interests" value="AI">
      <label for="ai">AI</label>
      <input type="checkbox" id="games" name="interests" value="Games">
      <label for="games">Games</label>
    </p>
 
    <p>
      <label for="comments">Comments:</label><br>
      <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
    </p>
 
    <p>
      <button type="submit">Send</button>
    </p>
 
  </form>
 
</body>
</html>
